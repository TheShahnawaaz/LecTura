name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    env:
      LECTURA_SYNC_ORIGIN: ${{ vars.LECTURA_SYNC_ORIGIN }}
      LECTURA_SYNC_RECIPIENT: ${{ vars.LECTURA_SYNC_RECIPIENT }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate public study sync configuration
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const raw = process.env.LECTURA_SYNC_ORIGIN || '';
          const recipient = process.env.LECTURA_SYNC_RECIPIENT || '';
          let valid = false;
          try {
            const url = new URL(raw);
            valid = url.protocol === 'https:' && !!url.hostname &&
              !url.username && !url.password && url.pathname === '/' &&
              !url.href.includes('?') && !url.href.includes('#') &&
              !!recipient.trim();
          } catch {}
          if (!valid) {
            console.error('Set repository variables LECTURA_SYNC_ORIGIN (HTTPS origin only) and LECTURA_SYNC_RECIPIENT (approved public name/contact) before releasing.');
            process.exit(1);
          }
          NODE

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Download yt-dlp sidecar binaries
        shell: bash
        run: |
          mkdir -p src-tauri/bin
          if [ "${{ matrix.platform }}" = "macos-latest" ]; then
            curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos -o src-tauri/bin/yt-dlp-aarch64-apple-darwin
            curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos -o src-tauri/bin/yt-dlp-x86_64-apple-darwin
            chmod +x src-tauri/bin/yt-dlp-aarch64-apple-darwin src-tauri/bin/yt-dlp-x86_64-apple-darwin
          elif [ "${{ matrix.platform }}" = "windows-latest" ]; then
            curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe -o src-tauri/bin/yt-dlp-x86_64-pc-windows-msvc.exe
          fi

      - name: Bump version from tag
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          node -e "
            const fs = require('fs');
            
            // 1. package.json
            const p = JSON.parse(fs.readFileSync('package.json'));
            p.version = '${VERSION}';
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
            
            // 2. tauri.conf.json
            const t = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json'));
            t.package.version = '${VERSION}';
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(t, null, 2) + '\n');
          "
          sed -i.bak "s/^version = \".*\"/version = \"${VERSION}\"/" src-tauri/Cargo.toml && rm -f src-tauri/Cargo.toml.bak

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'LecTura ${{ github.ref_name }}'
          releaseBody: |
            Adds study sharing, enabled by default, with a visible notice and pause control.
            Only your name, course/video information, focused study time and playback progress are shared with the LecTura administrator.
            Administrator approval is required before study-data uploads. Notes, screenshots, files and local paths remain on your laptop.
            Includes offline retry/deduplication, history-preserving course imports and a private administrator dashboard.
          # Hold the public updater on its previous release until all packages are verified.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  updater-json:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust for updater signature verification
        uses: dtolnay/rust-toolchain@stable

      - name: Build the isolated Minisign verifier
        run: cargo build --locked --release --manifest-path .github/scripts/verify-updater/Cargo.toml --target-dir "$RUNNER_TEMP/lectura-updater-verify"

      - name: Generate and upload latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          LECTURA_UPDATER_VERIFIER: ${{ runner.temp }}/lectura-updater-verify/release/lectura-verify-updater
        run: |
          node .github/scripts/generate-latest-json.cjs
